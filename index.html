<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole – Live-Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" id="start-screen">
    <h1>🔨 Whack-a-Mole</h1>
    <p>Wähle deine Schwierigkeit</p>
    <div class="difficulty-picker">
      <div class="difficulty-preview" id="difficultyEmoji">🐹</div>
      <input type="range" id="difficulty" min="0" max="2" step="1" value="1">
      <div class="ticks">
        <span class="tick" data-index="0">Leicht</span>
        <span class="tick" data-index="1">Mittel</span>
        <span class="tick" data-index="2">Schwer</span>
      </div>
    </div>
    <button id="startBtn">Spiel starten</button>
  </div>

  <div class="game" id="play-screen" hidden>
    <h1>🔨 Whack-a-Mole</h1>
    <div class="hud">
      <span>Punkte: <strong id="score">0</strong></span>
      <span>Zeit: <strong id="time">30</strong>s</span>
    </div>
    <div class="grid" id="grid"></div>
    <p id="result"></p>
    <div class="highscore-entry" id="highscoreEntry" hidden>
      <input type="text" id="playerName" placeholder="Dein Name" maxlength="20">
      <button id="saveScore">Speichern</button>
    </div>
    <table class="highscore-table" id="highscoreTable" hidden>
      <thead>
        <tr><th>Platz</th><th>Name</th><th>Punkte</th></tr>
      </thead>
      <tbody id="highscoreBody"></tbody>
    </table>
    <div class="result-actions">
      <button id="restart">Nochmal spielen</button>
      <button id="changeDifficulty">Schwierigkeit ändern</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
